<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>NYC Subway</title>
    
    <!-- PWA Requirements -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NYC Subway">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Touch Gesture Script Engines -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        /* Mobile notch protection formatting */
        .app-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(50px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            background-color: #111111;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding-left: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .app-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mta-bullet {
            background-color: #FCCC0A;
            color: #000;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
        }
        .map-container {
            position: absolute;
            top: calc(50px + env(safe-area-inset-top));
            left: 0;
            width: 100%;
            height: calc(100% - (50px + env(safe-area-inset-top)));
            background-color: #fff;
        }
        #subway-svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title"><span class="mta-bullet">M</span> NYC Subway</div>
    </header>

    <main class="map-container">
        <object id="subway-svg" data="map.svg" type="image/svg+xml"></object>
    </main>

    <script>
        document.getElementById('subway-svg').addEventListener('load', function() {
            // Configuration for combining Hammer.js gestures with svg-pan-zoom
            const touchEventsHandler = {
                haltSimultaneousGestures: false,
                init: function(options) {
                    this.hamburger = new Hammer(options.svgElement, {
                        inputClass: Hammer.SUPPORT_POINTER_EVENTS ? Hammer.PointerEventInput : Hammer.TouchInput
                    });
                    
                    this.hamburger.get('pinch').set({enable: true});

                    // Listens for double taps and applies a crisp scale jump centered on the touch point
                    this.hamburger.on('doubletap', function(ev) {
                        if (options.instance.getZoom() > 2) {
                            options.instance.zoomAtPoint(1, {x: ev.center.x, y: ev.center.y});
                        } else {
                            options.instance.zoomAtPoint(4, {x: ev.center.x, y: ev.center.y});
                        }
                    });

                    options.svgElement.addEventListener('touchmove', function(e) { e.preventDefault(); }, {passive: false});
                },
                destroy: function() {
                    this.hamburger.destroy();
                }
            };

            // Bind the framework engine to our graphic
            svgPanZoom('#subway-svg', {
                zoomEnabled: true,
                controlIconsEnabled: false,
                fit: true,
                center: true,
                minZoom: 1,
                maxZoom: 15,
                mouseWheelZoomEnabled: true,
                customEventsHandler: touchEventsHandler
            });
        });

        // Background service worker handler
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
