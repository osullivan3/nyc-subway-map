<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NYC Subway</title>
    
    <!-- PWA Requirements -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NYC Subway">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Leaflet Mapping Framework Engine -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        /* Mobile notch protection formatting */
        .app-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(50px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            background-color: #111111;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding-left: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000; /* Keeps header pinned above map container layers */
        }
        .app-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mta-bullet {
            background-color: #FCCC0A;
            color: #000;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
        }
        #map {
            position: absolute;
            top: calc(50px + env(safe-area-inset-top));
            left: 0;
            width: 100%;
            height: calc(100% - (50px + env(safe-area-inset-top)));
            background-color: #f4f3f0;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title"><span class="mta-bullet">M</span> NYC Subway</div>
    </header>

    <!-- Map viewport injection container -->
    <div id="map"></div>

    <script>
        // Initialize the tracking engine focused directly over Manhattan
        const map = L.map('map', {
            zoomControl: false, 
            maxZoom: 15,
            minZoom: 10
        }).setView([40.7580, -73.9855], 12); 

        // Loads a responsive, high-contrast open-source street/transit basemap layout
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO',
            subdomains: 'abcd'
        }).addTo(map);

        // Native PWA registration engine hook
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
