<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>NYC Subway</title>
    
    <!-- PWA Requirements -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NYC Subway">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .app-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(50px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            background-color: #111111;
            color: #ffffff;
            display: flex;
            align-items: center;
            padding-left: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .app-title {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mta-bullet {
            background-color: #FCCC0A;
            color: #000;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
        }
        .map-container {
            position: absolute;
            top: calc(50px + env(safe-area-inset-top));
            left: 0;
            width: 100%;
            height: calc(100% - (50px + env(safe-area-inset-top)));
            background-color: #fff;
            overflow: hidden;
            touch-action: none; /* Crucial: stops browser default scrolling interference */
        }
        #zoom-wrapper {
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            transition: transform 0.1s ease-out;
        }
        #subway-svg {
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows touches to fall right through to our tracking container */
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title"><span class="mta-bullet">M</span> NYC Subway</div>
    </header>

    <main class="map-container" id="track-container">
        <div id="zoom-wrapper">
            <object id="subway-svg" data="map.svg" type="image/svg+xml"></object>
        </div>
    </main>

    <script>
        const container = document.getElementById('track-container');
        const wrapper = document.getElementById('zoom-wrapper');

        let scale = 1, lastScale = 1;
        let pointX = 0, pointY = 0, startX = 0, startY = 0;
        let startDistance = 0;
        let lastTap = 0;

        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                // Drag tracking parameters
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;

                // Native Double Tap Engine
                const now = Date.now();
                if (now - lastTap < 300) {
                    if (scale > 1.5) {
                        scale = 1; pointX = 0; pointY = 0;
                    } else {
                        scale = 3.5;
                        // Center zoom dynamically closer to tap target locations
                        pointX = -(e.touches[0].clientX * 1.5);
                        pointY = -(e.touches[0].clientY * 1.5);
                    }
                    wrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
                    e.preventDefault();
                }
                lastTap = now;
            } else if (e.touches.length === 2) {
                // Pinch gesture math setup
                startDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                lastScale = scale;
            }
        });

        container.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                // Execute standard map dragging calculations
                pointX = e.touches[0].clientX - startX;
                pointY = e.touches[0].clientY - startY;
            } else if (e.touches.length === 2) {
                // Execute pinch tracking scaling math calculations
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                scale = Math.min(Math.max(lastScale * (currentDistance / startDistance), 1), 8);
            }
            
            wrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
            e.preventDefault();
        }, { passive: false });

        // Minimal service worker registration call
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
